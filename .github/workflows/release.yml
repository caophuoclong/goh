name: Build and publish packages

# Builds the binaries for every platform, attaches them to the GitHub release with checksums, and updates the
# Homebrew tap. Called by release-please.yml after a release PR is merged. Also runs on a pushed tag (the first
# release, or a rebuild) and by hand with a tag name.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3
        required: true
        type: string
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, flags: "" }
          - { target: x86_64-apple-darwin, os: macos-14, flags: "" }
          # The overlay popup is verified on macOS only; the Linux packages carry the inline menu (no popup).
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, flags: --no-popup }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, flags: --no-popup }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Package
        run: scripts/package.sh "${{ matrix.target }}" "$TAG" ${{ matrix.flags }}
      - name: Check the packaged binary runs and reports the tag's version
        # The Intel macOS build is cross-compiled on an Apple-silicon runner, which cannot run it.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          tar -xzf dist/goh-*-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          dir=$(ls -d "$RUNNER_TEMP"/goh-*-${{ matrix.target }})
          out=$("$dir/bin/goh" version)
          echo "$out"
          [ "$out" = "goh ${TAG#v}" ] || { echo "version mismatch: expected goh ${TAG#v}" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release (created here if release-please did not)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS

  homebrew:
    name: Update the Homebrew tap
    needs: publish
    runs-on: ubuntu-24.04
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'caophuoclong/homebrew-goh' }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when no tap token is configured
        id: gate
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set: the tap is not updated" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: checksums
          path: dist
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ env.TAP_TOKEN }}
          path: tap
      - name: Write the formula and push it
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p tap/Formula
          scripts/render-formula.sh "$TAG" dist/SHA256SUMS > tap/Formula/goh.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/goh.rb
          git diff --cached --quiet && exit 0
          git commit -m "goh ${TAG#v}"
          git push
