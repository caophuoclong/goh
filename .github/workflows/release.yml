name: Build and publish packages

# Builds the binaries for every platform, attaches them to the GitHub release with checksums, and updates the
# Homebrew tap. Called by release-please.yml after a release PR is merged. Also runs on a pushed tag (the first
# release, or a rebuild) and by hand with a tag name.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
      MACOS_SIGN_P12:
        required: false
      MACOS_SIGN_P12_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.2.3
        required: true
        type: string
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15, flags: "" }
          - { target: x86_64-apple-darwin, os: macos-15, flags: "" }
          # Linux packages include the X11 popup; unverified/native Wayland paths use inline.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, flags: "" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, flags: "" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      # No build cache here: a release binary must not be built from a cache other workflows can write to.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev
      # Built before the signing key is in a keychain, so no build script runs while it is; packaging then reuses it.
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p goh-daemon -p goh-popup
      - name: Import the macOS signing certificate
        # One self-signed certificate for every release (scripts/macos-signing-cert.sh), so that macOS keeps
        # goh-popup's own Accessibility permission across updates.
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "MACOS_SIGN_P12 is not set: Goh.app is signed ad hoc, and macOS asks for its permission again after each update" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          keychain=$RUNNER_TEMP/goh-signing.keychain-db
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain" # no auto-lock while the build runs
          security unlock-keychain -p "$password" "$keychain"
          # codesign finds the private key only in a keychain on the search list, even when --keychain names it.
          # shellcheck disable=SC2046 # the current list, one path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/goh-signing.p12"
          security import "$RUNNER_TEMP/goh-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/goh-signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          identity=$(security find-identity -p codesigning "$keychain" | awk '$1 == "1)" { print $2; exit }')
          [ -n "$identity" ] || { echo "MACOS_SIGN_P12 has no code-signing identity" >&2; exit 1; }
          echo "GOH_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "GOH_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package
        run: scripts/package.sh "${{ matrix.target }}" "$TAG" ${{ matrix.flags }}
      - name: Check the packaged binary runs and reports the tag's version
        # The Intel macOS build is cross-compiled on an Apple-silicon runner, which cannot run it.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          tar -xzf dist/goh-*-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          dir=$(ls -d "$RUNNER_TEMP"/goh-*-${{ matrix.target }})
          test -x "$dir/bin/goh-popup"
          out=$("$dir/bin/goh" version)
          echo "$out"
          [ "$out" = "goh ${TAG#v}" ] || { echo "version mismatch: expected goh ${TAG#v}" >&2; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to the GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release (created here if release-please did not)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: dist/SHA256SUMS

  homebrew:
    name: Update the Homebrew tap
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'caophuoclong/homebrew-goh' }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when no tap token is configured
        id: gate
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set: the tap is not updated" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.gate.outputs.skip != 'true'
        with:
          name: checksums
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.skip != 'true'
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ env.TAP_TOKEN }}
          path: tap
          # The formula update is pushed to the tap with this token.
          persist-credentials: true
      - name: Write the formula and push it
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p tap/Formula
          scripts/render-formula.sh "$TAG" dist/SHA256SUMS > tap/Formula/goh.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/goh.rb
          git diff --cached --quiet && exit 0
          git commit -m "goh ${TAG#v}"
          git push
