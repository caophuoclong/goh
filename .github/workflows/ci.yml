name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    name: Test (macOS, whole workspace)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-linux:
    name: Test (Linux, engine and daemon)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: cargo test --locked -p goh-core -p goh-daemon -p goh-theme -p goh-anchor

  scripts:
    name: Lint scripts and workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/*.sh
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color
