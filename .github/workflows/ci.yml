name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    name: Test (macOS, whole workspace)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install fish nushell
      - name: Install bash 5 and ble.sh for the ble.sh tests
        env:
          BLESH_TAG: v0.4.0-devel3
          BLESH_ASSET: ble-0.4.0-devel3-2.tar.xz
          SHA256: bdcdcfff216495403adf82a701fe41675f64b64644dc77caabd3e015871ebd61
        run: |
          brew install bash
          curl -fsSL -o "$RUNNER_TEMP/blesh.tar.xz" "https://github.com/akinomyoga/ble.sh/releases/download/${BLESH_TAG}/${BLESH_ASSET}"
          echo "${SHA256}  $RUNNER_TEMP/blesh.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/blesh.tar.xz" -C "$RUNNER_TEMP"
          echo "GOH_TEST_BLESH=$RUNNER_TEMP/ble-0.4.0-devel3/ble.sh" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  budgets:
    name: Speed and size budgets (release, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p goh-daemon -p goh-popup
      - run: scripts/check-binary-size.sh
      - run: cargo run --release --locked -p goh-core --example bench

  scripts:
    name: Lint scripts and workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: shellcheck install.sh scripts/*.sh crates/goh-popup/tools/linux-xwayland-test.sh crates/goh-popup/tools/linux-x11-test.sh
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
