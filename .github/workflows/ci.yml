name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    name: Test (macOS, whole workspace)
    runs-on: macos-15
    # It takes about 5 minutes; a hung pty test should fail the job, not hold a runner for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install fish nushell
      - name: Install bash 5 and ble.sh for the ble.sh tests
        env:
          BLESH_TAG: v0.4.0-devel3
          BLESH_ASSET: ble-0.4.0-devel3-2.tar.xz
          SHA256: bdcdcfff216495403adf82a701fe41675f64b64644dc77caabd3e015871ebd61
        run: |
          brew install bash
          curl -fsSL -o "$RUNNER_TEMP/blesh.tar.xz" "https://github.com/akinomyoga/ble.sh/releases/download/${BLESH_TAG}/${BLESH_ASSET}"
          echo "${SHA256}  $RUNNER_TEMP/blesh.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/blesh.tar.xz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/ble-0.4.0-devel3/ble.sh"
          echo "GOH_TEST_BLESH=$RUNNER_TEMP/ble-0.4.0-devel3/ble.sh" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  budgets:
    name: Speed and size budgets (release, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p goh-daemon -p goh-popup
      - run: scripts/check-binary-size.sh
      - run: cargo run --release --locked -p goh-core --example bench

  windows:
    name: Windows popup (test, release build)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in 'packaging/windows/install-test-kit.ps1', 'crates/goh-popup/tools/overlay-demo.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { "${f}: $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
      # Only these crates build on Windows so far; the daemon and goh are Unix-only.
      - run: cargo test --locked -p goh-anchor -p goh-popup -p goh-theme
      - run: cargo build --release --locked -p goh-popup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goh-popup-x86_64-pc-windows-msvc
          path: target/release/goh-popup.exe
          if-no-files-found: error

  wsl-package:
    name: Linux package for WSL (release build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Package
        run: scripts/package.sh x86_64-unknown-linux-gnu "dev-${GITHUB_SHA::7}"
      - name: Check the packaged binary runs
        run: |
          tar -xzf dist/goh-*.tar.gz -C "$RUNNER_TEMP"
          dir=$(ls -d "$RUNNER_TEMP"/goh-*-x86_64-unknown-linux-gnu)
          test -x "$dir/bin/goh-popup"
          "$dir/bin/goh" version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wsl-package-x86_64-unknown-linux-gnu
          path: dist/*
          if-no-files-found: error

  # Everything a Windows tester needs, built: unpack it and run install-test-kit.ps1 (docs/windows-checklist.md).
  windows-kit:
    name: Windows test kit
    needs: [windows, wsl-package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: parts
      - name: Assemble the kit
        run: |
          mkdir kit
          cp parts/goh-popup-x86_64-pc-windows-msvc/goh-popup.exe parts/wsl-package-x86_64-unknown-linux-gnu/* kit/
          cp install.sh packaging/windows/install-test-kit.ps1 docs/windows-checklist.md kit/
          cp crates/goh-popup/tools/overlay-demo.ps1 crates/goh-popup/tools/sample-frame-auto.json kit/
          echo "$GITHUB_SHA" > kit/COMMIT
          ls -l kit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goh-windows-test-kit
          path: kit/
          if-no-files-found: error

  scripts:
    name: Lint scripts and workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: shellcheck install.sh scripts/*.sh crates/goh-popup/tools/linux-xwayland-test.sh crates/goh-popup/tools/linux-x11-test.sh
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'
