name: PR title

# The release version is worked out from commit messages (Conventional Commits). Pull requests are squash-merged,
# so the PR title becomes the commit message: it has to follow the format.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            refactor
            test
            ci
            build
          requireScope: false
