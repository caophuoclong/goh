[package]
name = "goh-popup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
goh-anchor = { path = "../goh-anchor" }
goh-theme = { path = "../goh-theme" }
png = "0.18"
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
winit = "0.30"
