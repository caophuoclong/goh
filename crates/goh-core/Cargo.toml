[package]
name = "goh-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
jsonschema = "0.30"
tempfile = "3"

[[bin]]
name = "goh-complete"
path = "src/bin/goh-complete.rs"
