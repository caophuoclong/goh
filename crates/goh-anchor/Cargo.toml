[package]
name = "goh-anchor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.29", default-features = false, features = ["proxies", "zbus"] }
async-io = "2"
futures-lite = "2"
x11rb = { version = "0.13", features = ["randr"] }
